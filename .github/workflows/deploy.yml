name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: bun install

      - name: Build static site
        env:
          CONFIGURED_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH }}
        run: |
          if [ -n "$CONFIGURED_BASE_PATH" ]; then
            export NEXT_PUBLIC_BASE_PATH="$CONFIGURED_BASE_PATH"
          else
            REPO_NAME="${GITHUB_REPOSITORY#*/}"
            REPO_OWNER="${GITHUB_REPOSITORY%/*}"
            if [ "$REPO_NAME" != "$REPO_OWNER.github.io" ]; then
              export NEXT_PUBLIC_BASE_PATH="/$REPO_NAME"
            fi
          fi
          echo "Building static site with NEXT_PUBLIC_BASE_PATH=$NEXT_PUBLIC_BASE_PATH"
          bun run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
